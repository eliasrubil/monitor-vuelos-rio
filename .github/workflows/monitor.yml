name: Monitor de vuelos

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 08:00 Argentina: corrida de la mañana (Morning Sunshine!)
    - cron: "0 23 * * *"   # 23:00 UTC = 20:00 Argentina: corrida de la noche (Night Owl!)
  workflow_dispatch:
    inputs:
      slot:
        description: "Corrida: auto (según la hora; no repite un turno que ya corrió hoy), morning o night (adelanta ese turno: la corrida programada del día se saltea)"
        type: choice
        options: [auto, morning, night]
        default: auto
      dry_run:
        description: "Dry run: hasta dry_run_max_queries consultas; no guarda precios ni alerta (sí suma al contador de uso)"
        type: boolean
        default: false
      full_scan:
        description: "Barrido completo de todas las combinaciones"
        type: boolean
        default: false
      test_alert:
        description: "Solo enviar un mensaje de prueba por Telegram y email"
        type: boolean
        default: false
      demo_alert:
        description: "Enviar alertas simuladas (un email y un Telegram) para ver el formato; no consulta la API"
        type: boolean
        default: false

concurrency:
  group: monitor-vuelos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # hasta ~110 consultas (~20 s cada una) más los reintentos de respuestas vacías
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitor
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_FULL_SCAN: ${{ inputs.full_scan }}
          IN_TEST_ALERT: ${{ inputs.test_alert }}
          IN_DEMO_ALERT: ${{ inputs.demo_alert }}
          IN_SLOT: ${{ inputs.slot }}
        run: |
          args=(--slot "${IN_SLOT:-auto}")
          if [ "$IN_DEMO_ALERT" = "true" ]; then args+=(--demo-alert); fi
          if [ "$IN_TEST_ALERT" = "true" ]; then args+=(--test-alert); fi
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$IN_FULL_SCAN" = "true" ]; then args+=(--full-scan); fi
          python -m monitor "${args[@]}"

      # También en dry-run: las requests se cobran y el contador de uso vive en la base.
      - name: Commitear la base
        if: ${{ !cancelled() && inputs.test_alert != true && inputs.demo_alert != true }}
        env:
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ ! -f data/prices.db ]; then echo "No hay base para commitear"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          if git diff --cached --quiet; then
            echo "La base no cambió"
            exit 0
          fi
          if [ "$IN_DRY_RUN" = "true" ]; then what="uso dry-run"; else what="precios"; fi
          git commit -m "data: ${what} $(TZ=America/Argentina/Buenos_Aires date '+%F %H:%M') [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
