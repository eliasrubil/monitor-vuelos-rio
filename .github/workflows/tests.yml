name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04   # versión fija: ubuntu-latest está migrando de imagen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
