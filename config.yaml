# Monitor de precios de vuelos Buenos Aires -> Brasil.
# Todos los parámetros de la corrida viven acá. Los secrets NO van en este archivo:
# se leen de variables de entorno (ver README).

source: ignav            # adaptador de PriceSource a usar

search:
  # BUE es el código de ciudad de Buenos Aires: una sola consulta cubre EZE y AEP (incluidas las
  # combinaciones mixtas, p. ej. ida desde EZE y vuelta a AEP). El aeropuerto real se lee de cada tramo.
  origins: [BUE]
  # Río = solo GIG (no se usa el código de ciudad RIO porque incluye SDU). São Paulo = solo GRU.
  destinations: [GIG, GRU, CFB]
  # Ida y vuelta siempre al mismo destino. open_jaw: true habilitaría combinaciones
  # tipo ida GIG / vuelta CFB, pero requiere un adaptador que lo soporte (Ignav todavía no).
  open_jaw: false
  departure_from: 2027-01-14   # fecha de ida >= esta
  return_until: 2027-02-05     # fecha de vuelta <= esta
  durations: [9, 10, 11]       # días entre ida y vuelta
  adults: 5
  max_stops: 1
  cabin_class: economy
  market: US                   # mercado de Ignav (define la moneda)
  currency: USD                # moneda esperada; se descartan tarifas en otra moneda
  # Aerolíneas que nunca se consideran: se excluyen en la búsqueda (airlines_exclude de la API) y además
  # se descarta cualquier itinerario con un tramo operado por ellas. FO = Flybondi.
  airlines_exclude: [FO]
  # Aeropuertos que nunca pueden ser salida ni llegada de un tramo (ni el destino del viaje). Como escala
  # están permitidos: BUE -> SDU -> GIG o GIG -> SDU -> BUE se aceptan. SDU = Santos Dumont (Río).
  airports_exclude: [SDU]

ignav:
  base_url: https://ignav.com/api
  timeout_seconds: 60
  max_retries: 3               # reintentos ante timeouts, 424, 429 y 5xx
  backoff_seconds: 2           # espera base; se duplica en cada reintento
  # price.amount es el TOTAL de todos los pasajeros: precio por persona = amount / adults.
  # Verificado con los links de reserva reales (p. ej. Swiss "OfferedPrice=1933.00 ... PaxAdult=5").
  # No cambiar a false: con false los precios quedan multiplicados por 5.
  price_is_total: true
  allow_self_transfer: true    # default de la API

budget:
  max_requests_per_month: 2500 # si la corrida lo superaría, se saltea y se avisa
  dry_run_max_queries: 4       # tope de consultas de un dry-run (se cobran y se suman al contador)

optimization:
  top_k: 8                     # pares de fechas más baratos por destino que se consultan siempre
  rotating_k: 5                # pares extra del resto, el dato más viejo primero
  max_staleness_runs: 6        # ningún par queda más de N corridas (de su destino) sin actualizar
  no_service_after_empty_runs: 2
  recheck_days: 14             # cada cuánto se reconsulta un par marcado no_service
  reduced_destinations: [GRU]
  reduced_interval_days: 2     # GRU cada 2 días: ~1.000 requests/mes con BUE
  reduced_reference_destination: GIG
  gru_margin_usd: 50           # GRU pasa a normal si mediana_pp(GRU) <= mediana_pp(GIG) - margen

detection:
  temporal:                    # Regla A: el itinerario contra su propio historial
    drop_pct: 0.15
    robust_z: -2.5
    min_observations: 7
    mad_scale: 1.4826          # z robusto = (precio - mediana) / (mad_scale * MAD)
  cross:                       # Regla B: contra los demás pares del mismo destino
    max_rank: 3                # solo las 3 fechas más baratas del destino pueden alertar
    drop_pct: 0.15
    min_pairs: 10
  absolute_threshold_usd_pp: null   # Regla C: desactivada mientras sea null
  antispam_min_drop_pct: 0.03

alerts:
  telegram: true
  email: true
  summary_telegram: true       # resumen de la corrida por Telegram; el email lleva solo las alertas (uno por día)
  summary_top_n: 5
  booking_links: true          # pide el link de reserva solo para itinerarios alertados

schedule:
  stop_after: 2027-01-10       # después de esta fecha la corrida termina sin consultar

database:
  path: data/prices.db

airport_names:
  BUE: Buenos Aires
  EZE: Buenos Aires (Ezeiza)
  AEP: Buenos Aires (Aeroparque)
  GIG: Río de Janeiro (Galeão)
  GRU: São Paulo (Guarulhos)
  CFB: Cabo Frío

# Nombres para mostrar en las alertas (la API devuelve solo el código IATA de la aerolínea).
# Si aparece un código que no está acá, se muestra el código.
airline_names:
  AR: Aerolíneas Argentinas
  G3: GOL
  LA: LATAM
  JJ: LATAM Brasil
  4M: LATAM Argentina
  AD: Azul
  FO: Flybondi
  JA: JetSMART
  H2: Sky Airline
  AV: Avianca
  CM: Copa Airlines
  LX: Swiss
  AC: Air Canada
  AA: American Airlines
  UA: United Airlines
  DL: Delta
  IB: Iberia
  UX: Air Europa
  AF: Air France
  KL: KLM
  LH: Lufthansa
  AZ: ITA Airways
  TP: TAP Air Portugal
  ET: Ethiopian Airlines
  EK: Emirates
  QR: Qatar Airways
  TK: Turkish Airlines
